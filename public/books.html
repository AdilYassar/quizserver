<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books - Quiz Server</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen">
        <!-- Navigation -->
        <nav class="bg-white border-b border-gray-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center py-4">
                    <h1 class="text-xl font-semibold text-black tracking-tight">Books Management</h1>
                    <a href="/custom-dashboard" 
                       class="bg-black text-white px-6 py-3 rounded-lg no-underline font-medium transition-all duration-300 shadow-sm hover:bg-gray-800 hover:shadow-md hover:-translate-y-0.5 focus:outline-2 focus:outline-black focus:outline-offset-2 h-10 flex items-center gap-2">
                        <i class="fas fa-arrow-left"></i>
                        Back to Dashboard
                    </a>
                </div>
            </div>
        </nav>

        <!-- Content -->
        <div class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
            <!-- Stats Cards -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-5 mb-8">
                <div class="bg-white rounded-xl border border-gray-200 p-8 shadow-sm transition-all duration-300 relative overflow-hidden min-h-[140px] flex flex-col hover:-translate-y-0.5 hover:shadow-md hover:border-gray-300">
                    <div class="absolute top-0 left-0 right-0 h-0.5 bg-black"></div>
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Total Books</span>
                        <div class="w-12 h-12 bg-gray-100 rounded-lg flex items-center justify-center text-xl text-black shadow-sm">
                            <i class="fas fa-book"></i>
                        </div>
                    </div>
                    <p class="text-4xl font-semibold text-black mb-2 leading-none tracking-tight flex-grow" id="totalBooks">-</p>
                </div>
                
                <div class="bg-white rounded-xl border border-gray-200 p-8 shadow-sm transition-all duration-300 relative overflow-hidden min-h-[140px] flex flex-col hover:-translate-y-0.5 hover:shadow-md hover:border-gray-300">
                    <div class="absolute top-0 left-0 right-0 h-0.5 bg-black"></div>
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Published</span>
                        <div class="w-12 h-12 bg-gray-100 rounded-lg flex items-center justify-center text-xl text-black shadow-sm">
                            <i class="fas fa-check-circle"></i>
                        </div>
                    </div>
                    <p class="text-4xl font-semibold text-black mb-2 leading-none tracking-tight flex-grow" id="publishedBooks">-</p>
                </div>
                
                <div class="bg-white rounded-xl border border-gray-200 p-8 shadow-sm transition-all duration-300 relative overflow-hidden min-h-[140px] flex flex-col hover:-translate-y-0.5 hover:shadow-md hover:border-gray-300">
                    <div class="absolute top-0 left-0 right-0 h-0.5 bg-black"></div>
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Categories</span>
                        <div class="w-12 h-12 bg-gray-100 rounded-lg flex items-center justify-center text-xl text-black shadow-sm">
                            <i class="fas fa-folder"></i>
                        </div>
                    </div>
                    <p class="text-4xl font-semibold text-black mb-2 leading-none tracking-tight flex-grow" id="totalCategories">-</p>
                </div>
                
                <div class="bg-white rounded-xl border border-gray-200 p-8 shadow-sm transition-all duration-300 relative overflow-hidden min-h-[140px] flex flex-col hover:-translate-y-0.5 hover:shadow-md hover:border-gray-300">
                    <div class="absolute top-0 left-0 right-0 h-0.5 bg-black"></div>
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Downloads</span>
                        <div class="w-12 h-12 bg-gray-100 rounded-lg flex items-center justify-center text-xl text-black shadow-sm">
                            <i class="fas fa-download"></i>
                        </div>
                    </div>
                    <p class="text-4xl font-semibold text-black mb-2 leading-none tracking-tight flex-grow" id="totalDownloads">-</p>
                </div>
            </div>

            <!-- Book Form & List -->
            <div class="grid lg:grid-cols-3 gap-8">
                <!-- Book Form -->
                <div class="lg:col-span-1">
                    <div class="bg-white rounded-xl border border-gray-200 p-6">
                        <h2 class="text-xl font-semibold text-gray-900 mb-6">Add New Book</h2>
                        
                        <form id="bookForm" class="space-y-4">
                            <div>
                                <label for="title" class="block text-sm font-medium text-gray-700 mb-2">Book Title</label>
                                <input type="text" id="title" name="title" required 
                                       placeholder="Enter book title"
                                       class="w-full px-4 py-3.5 bg-white border border-gray-200 rounded-lg text-sm text-black placeholder-gray-400 focus:outline-none focus:border-black focus:shadow-[0_0_0_3px_rgba(0,0,0,0.05)] transition-all h-12">
                            </div>

                            <div>
                                <label for="author" class="block text-sm font-medium text-gray-700 mb-2">Author</label>
                                <input type="text" id="author" name="author" required 
                                       placeholder="Enter author name"
                                       class="w-full px-4 py-3.5 bg-white border border-gray-200 rounded-lg text-sm text-black placeholder-gray-400 focus:outline-none focus:border-black focus:shadow-[0_0_0_3px_rgba(0,0,0,0.05)] transition-all h-12">
                            </div>

                            <div>
                                <label for="categoryId" class="block text-sm font-medium text-gray-700 mb-2">Category</label>
                                <select id="categoryId" name="categoryId" required 
                                        class="w-full px-4 py-3.5 bg-white border border-gray-200 rounded-lg text-sm text-black focus:outline-none focus:border-black focus:shadow-[0_0_0_3px_rgba(0,0,0,0.05)] transition-all h-12">
                                    <option value="">Select Category</option>
                                </select>
                            </div>

                            <div>
                                <label for="description" class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                                <textarea id="description" name="description" rows="3" 
                                          placeholder="Book description..."
                                          class="w-full px-4 py-3.5 bg-white border border-gray-200 rounded-lg text-sm text-black placeholder-gray-400 focus:outline-none focus:border-black focus:shadow-[0_0_0_3px_rgba(0,0,0,0.05)] transition-all resize-none"></textarea>
                            </div>

                            <div>
                                <label for="pdfFile" class="block text-sm font-medium text-gray-700 mb-2">PDF File</label>
                                <input type="file" id="pdfFile" name="pdfFile" accept=".pdf" 
                                       class="w-full px-4 py-3.5 bg-white border border-gray-200 rounded-lg text-sm text-black focus:outline-none focus:border-black focus:shadow-[0_0_0_3px_rgba(0,0,0,0.05)] transition-all file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-gray-100 file:text-gray-800 hover:file:bg-gray-200">
                            </div>

                            <div>
                                <label for="coverImage" class="block text-sm font-medium text-gray-700 mb-2">Cover Image</label>
                                <input type="file" id="coverImage" name="coverImage" accept="image/*" 
                                       class="w-full px-4 py-3.5 bg-white border border-gray-200 rounded-lg text-sm text-black focus:outline-none focus:border-black focus:shadow-[0_0_0_3px_rgba(0,0,0,0.05)] transition-all file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-gray-100 file:text-gray-800 hover:file:bg-gray-200">
                            </div>

                            <div>
                                <label for="isPublished" class="flex items-center space-x-2 cursor-pointer">
                                    <input type="checkbox" id="isPublished" name="isPublished" checked 
                                           class="w-4 h-4 text-black border-gray-300 rounded focus:ring-black focus:ring-2">
                                    <span class="text-sm font-medium text-gray-700">Published</span>
                                </label>
                            </div>

                            <button type="submit" 
                                    class="w-full bg-black hover:bg-gray-800 text-white font-medium py-3 px-4 rounded-lg transition-all duration-300 shadow-sm hover:shadow-md hover:-translate-y-0.5 focus:outline-2 focus:outline-black focus:outline-offset-2">
                                <span id="submitBtnText">Add Book</span>
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Books List -->
                <div class="lg:col-span-2">
                    <div class="bg-white rounded-xl border border-gray-200">
                        <div class="flex items-center justify-between p-6 border-b border-gray-200">
                            <h2 class="text-xl font-semibold text-gray-900">All Books</h2>
                            <button onclick="loadBooks()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
                                <i class="fas fa-sync-alt text-gray-600"></i>
                            </button>
                        </div>

                        <!-- Search & Filter -->
                        <div class="p-6 border-b border-gray-200">
                            <div class="flex flex-col sm:flex-row gap-4">
                                <div class="flex-1 relative">
                                    <input type="text" id="searchInput" placeholder="Search books..."
                                           class="w-full px-4 py-3.5 pl-10 bg-white border border-gray-200 rounded-lg text-sm text-black placeholder-gray-400 focus:outline-none focus:border-black focus:shadow-[0_0_0_3px_rgba(0,0,0,0.05)] h-12">
                                    <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                                </div>
                                <select id="categoryFilter" class="px-4 py-3.5 bg-white border border-gray-200 rounded-lg text-sm text-black focus:outline-none focus:border-black focus:shadow-[0_0_0_3px_rgba(0,0,0,0.05)] h-12">
                                    <option value="">All Categories</option>
                                </select>
                            </div>
                        </div>

                        <!-- Books Grid -->
                        <div id="booksList" class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4 max-h-96 overflow-y-auto custom-scrollbar">
                            <div class="col-span-full flex items-center justify-center py-12">
                                <div class="text-center">
                                    <div class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-3">
                                        <i class="fas fa-book text-gray-400"></i>
                                    </div>
                                    <p class="text-sm text-gray-500">Loading books...</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/books.js"></script>
</body>
</html>
