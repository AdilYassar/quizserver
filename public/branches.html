<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Branches Management - Quiz Server</title>
    <link rel="stylesheet" href="css/management-shared.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="management-container">
        <!-- Main Content -->
        <main class="main-content">
            <div class="top-bar">
                <h1 class="page-title">Branches Management</h1>
                <a href="/custom-dashboard" class="admin-link">
                    <i class="fas fa-arrow-left"></i>
                    Back to Dashboard
                </a>
            </div>

            <div class="content">
                <!-- Page Header -->
                <div class="page-header">
                    <h1>Branches Management</h1>
                    <p>Manage branch locations and their courses in the system.</p>
                </div>

                <!-- Stats Cards -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-header">
                            <span class="stat-title">Total Branches</span>
                            <div class="stat-icon">
                                <i class="fas fa-building"></i>
                            </div>
                        </div>
                        <div class="stat-value" id="totalBranches">-</div>
                        <div class="stat-change">
                            <i class="fas fa-arrow-up"></i>
                            <span>All branches</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-header">
                            <span class="stat-title">Active Branches</span>
                            <div class="stat-icon">
                                <i class="fas fa-map-marker-alt"></i>
                            </div>
                        </div>
                        <div class="stat-value" id="activeBranches">-</div>
                        <div class="stat-change">
                            <i class="fas fa-arrow-up"></i>
                            <span>With courses</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-header">
                            <span class="stat-title">Total Courses</span>
                            <div class="stat-icon">
                                <i class="fas fa-book"></i>
                            </div>
                        </div>
                        <div class="stat-value" id="totalCourses">-</div>
                        <div class="stat-change">
                            <i class="fas fa-arrow-up"></i>
                            <span>Across branches</span>
                        </div>
                    </div>
                </div>

                <!-- Action Bar -->
                <div class="action-bar">
                    <div class="search-container">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="searchInput" class="search-input" placeholder="Search branches by name or location...">
                    </div>
                    <div class="action-buttons">
                        <button class="btn btn-primary" onclick="openCreateModal()">
                            <i class="fas fa-plus"></i>
                            Add Branch
                        </button>
                        <button class="btn btn-danger" onclick="bulkDelete()" id="bulkDeleteBtn" disabled>
                            <i class="fas fa-trash"></i>
                            Delete Selected
                        </button>
                    </div>
                </div>

                <!-- Branches Table -->
                <div class="table-container">
                    <table class="table">
                    <thead>
                        <tr>
                            <th>
                                <input type="checkbox" id="selectAll" onchange="toggleSelectAll()">
                            </th>
                            <th>Name</th>
                            <th>Location</th>
                            <th>Courses</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="branchesTableBody">
                        <tr>
                            <td colspan="5" class="loading">
                                <div class="spinner"></div>
                                Loading branches...
                            </td>
                        </tr>
                    </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="pagination" id="pagination">
                    <!-- Pagination buttons will be generated here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Create/Edit Branch Modal -->
    <div id="branchModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Add New Branch</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="branchForm">
                    <div class="form-group">
                        <label for="name" class="form-label">Branch Name *</label>
                        <input type="text" id="name" name="name" class="form-control" required>
                        <div class="invalid-feedback" id="nameError"></div>
                    </div>
                    <div class="form-group">
                        <label for="location" class="form-label">Location *</label>
                        <input type="text" id="location" name="location" class="form-control" required>
                        <div class="invalid-feedback" id="locationError"></div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveBranch()">
                    <i class="fas fa-save"></i>
                    Save Branch
                </button>
            </div>
        </div>
    </div>

    <script src="/js/branches.js"></script>
</body>
</html>
