<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Manager - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #fafafa;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        .custom-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #e0e0e0 transparent;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #e0e0e0;
            border-radius: 20px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: #bdbdbd;
        }
    </style>
</head>
<body class="font-inter min-h-screen bg-gray-50">
    <!-- Navigation Header -->
    <nav class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-8">
                    <a href="/custom-dashboard" class="flex items-center space-x-2 text-gray-600 hover:text-gray-900 transition-colors">
                        <i class="fas fa-arrow-left"></i>
                        <span class="font-medium">Dashboard</span>
                    </a>
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 bg-gray-900 rounded-lg flex items-center justify-center">
                            <i class="fas fa-video text-white text-sm"></i>
                        </div>
                        <span class="font-semibold text-gray-900">Video Manager</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 lg:px-8 py-12">
        <!-- Hero Section -->
        <div class="mb-12">
            <h1 class="text-4xl font-bold text-gray-900 mb-2">
                Video Library
            </h1>
            <p class="text-lg text-gray-600">
                Upload and manage your video content
            </p>
        </div>

        <div class="grid lg:grid-cols-2 gap-8">
            <!-- Upload Section -->
            <div>
                <div class="bg-white rounded-2xl border border-gray-200 p-8">
                    <h2 class="text-xl font-semibold text-gray-900 mb-6">Upload Video</h2>

                    <form id="videoUploadForm" class="space-y-6">
                        <!-- Video File Upload -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-3">
                                Video File
                            </label>
                            <div id="dropZone" class="relative border-2 border-dashed border-gray-300 rounded-xl p-12 text-center hover:border-gray-400 transition-colors cursor-pointer">
                                <input type="file" id="video" name="video" accept="video/*" class="hidden">
                                <div id="uploadPrompt" class="space-y-3">
                                    <div class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center mx-auto">
                                        <i class="fas fa-cloud-upload-alt text-xl text-gray-400"></i>
                                    </div>
                                    <div>
                                        <p class="text-sm font-medium text-gray-900">Click to upload or drag and drop</p>
                                        <p class="text-xs text-gray-500 mt-1">MP4, AVI, MOV up to 80MB</p>
                                    </div>
                                </div>
                                <div id="file-display" class="hidden"></div>
                            </div>
                        </div>

                        <!-- Title Input -->
                        <div>
                            <label for="title" class="block text-sm font-medium text-gray-700 mb-2">
                                Title
                            </label>
                            <input 
                                type="text" 
                                id="title" 
                                name="title" 
                                required 
                                placeholder="Enter video title"
                                class="w-full px-4 py-2.5 bg-white border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-all"
                            >
                        </div>

                        <!-- Description Input -->
                        <div>
                            <label for="description" class="block text-sm font-medium text-gray-700 mb-2">
                                Description
                            </label>
                            <textarea 
                                id="description" 
                                name="description" 
                                rows="4" 
                                placeholder="Enter description (optional)"
                                class="w-full px-4 py-2.5 bg-white border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-all custom-scrollbar resize-none"
                            ></textarea>
                        </div>

                        <!-- Upload Button -->
                        <button 
                            type="submit" 
                            id="uploadBtn"
                            class="w-full bg-gray-900 hover:bg-gray-800 text-white font-medium py-3 px-6 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                        >
                            <span id="uploadBtnText">Upload Video</span>
                        </button>

                        <!-- Progress Bar -->
                        <div id="progressContainer" class="hidden space-y-2">
                            <div class="flex justify-between items-center">
                                <span class="text-sm font-medium text-gray-700">Uploading</span>
                                <span id="progressText" class="text-sm text-gray-500">0%</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-2 overflow-hidden">
                                <div id="progressFill" class="h-full bg-gray-900 rounded-full transition-all duration-300" style="width: 0%"></div>
                            </div>
                        </div>

                        <!-- Status Messages -->
                        <div id="status" class="hidden p-4 rounded-lg text-sm"></div>
                    </form>
                </div>
            </div>

            <!-- Video List Section -->
            <div>
                <div class="bg-white rounded-2xl border border-gray-200 p-8">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-xl font-semibold text-gray-900">Video Library</h2>
                        <button onclick="loadVideos()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
                            <i class="fas fa-sync-alt text-gray-600"></i>
                        </button>
                    </div>

                    <!-- Search -->
                    <div class="mb-6">
                        <div class="relative">
                            <input 
                                type="text" 
                                id="searchInput" 
                                placeholder="Search videos..."
                                class="w-full px-4 py-2.5 pl-10 bg-white border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-all"
                            >
                            <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        </div>
                    </div>

                    <!-- Video List -->
                    <div id="videoContainer" class="space-y-3 max-h-96 overflow-y-auto custom-scrollbar">
                        <div class="flex items-center justify-center py-12">
                            <div class="text-center">
                                <div class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-3">
                                    <i class="fas fa-video text-gray-400"></i>
                                </div>
                                <p class="text-sm text-gray-500">Loading videos...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/video-upload.js"></script>
</body>
</html>
