<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - QuizServer</title>
    <style>
        :root {
            --color-slate-900: #1e293b;
            --color-slate-700: #334155;
            --color-indigo-600: #4f46e5;
            --color-coral-400: #ffa586;
            --color-red-600: #dc2626;
            --color-red-900: #7f1d1d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--color-slate-900);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            padding: 24px;
            border-radius: 4px;
            box-shadow: 0 1px 3px rgba(30, 41, 59, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo h1 {
            color: var(--color-slate-900);
            font-size: 28px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .logo p {
            color: var(--color-slate-700);
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--color-slate-700);
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(52, 65, 88, 0.1);
            border-radius: 4px;
            font-size: 16px;
            transition: border-color 0.3s;
            height: 40px;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--color-indigo-600);
        }

        .remember-me {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        .remember-me input {
            width: auto;
            margin-right: 8px;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: var(--color-indigo-600);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s;
            height: 40px;
        }

        .login-btn:hover {
            transform: translateY(-1px);
        }

        .demo-info {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 4px;
            margin-top: 16px;
            text-align: center;
            color: var(--color-slate-700);
            font-size: 14px;
        }

        .error-message {
            background: #fed7d7;
            color: var(--color-red-600);
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            display: none;
            border-left: 4px solid var(--color-red-600);
        }

        .success-message {
            background: #d1fae5;
            color: #065f46;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            display: none;
            border-left: 4px solid #10b981;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🎓 QuizServer</h1>
            <p>Admin Portal</p>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" value="admin@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <div class="remember-me">
                <input type="checkbox" id="rememberMe" name="rememberMe">
                <label for="rememberMe">Remember me</label>
            </div>

            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div class="demo-info">
            <strong>Demo Credentials:</strong><br>
            Email: admin@example.com<br>
            Password: admin123
        </div>
    </div>

    <script>
        // Simple, working login script
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            // Clear previous messages
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            // Basic validation
            if (!email || !password) {
                showError('Please fill in all fields');
                return;
            }
            
            try {
                console.log('Attempting login with:', { email, password: '***' });
                
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                    credentials: 'include' // Important for session cookies
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                const data = await response.json();
                console.log('Response data:', data);
                
                if (response.ok) {
                    showSuccess('Login successful! Redirecting...');
                    setTimeout(() => {
                        window.location.href = '/custom-dashboard';
                    }, 1500);
                } else {
                    showError(data.message || 'Login failed');
                }
            } catch (error) {
                console.error('Login error details:', error);
                console.error('Error message:', error.message);
                console.error('Error stack:', error.stack);
                showError('Network error: ' + error.message);
            }
        });
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
        }
    </script>
</body>
</html>
