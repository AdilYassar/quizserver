<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - QuizServer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-black: #000000;
            --color-gray-900: #1a1a1a;
            --color-gray-800: #2d2d2d;
            --color-gray-700: #4a4a4a;
            --color-gray-600: #6b6b6b;
            --color-gray-500: #8a8a8a;
            --color-gray-400: #a8a8a8;
            --color-gray-300: #c4c4c4;
            --color-gray-200: #e0e0e0;
            --color-gray-100: #f5f5f5;
            --color-white: #ffffff;
            --bg-primary: #f5f5f5;
            --bg-card: #ffffff;
            --border-color: #e0e0e0;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.07);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .login-container {
            background: var(--color-white);
            padding: 48px 40px;
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 440px;
            transition: var(--transition);
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo h1 {
            color: var(--color-black);
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .logo p {
            color: var(--color-gray-600);
            font-size: 15px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--color-gray-700);
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            transition: var(--transition);
            height: 48px;
            background: var(--color-white);
            color: var(--color-black);
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--color-black);
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
        }

        .form-group input::placeholder {
            color: var(--color-gray-400);
        }

        .remember-me {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
            gap: 8px;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin: 0;
            cursor: pointer;
            accent-color: var(--color-black);
        }

        .remember-me label {
            margin: 0;
            cursor: pointer;
            color: var(--color-gray-700);
            font-size: 14px;
            font-weight: 400;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--color-black);
            color: var(--color-white);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            height: 48px;
            font-family: inherit;
            box-shadow: var(--shadow-sm);
        }

        .login-btn:hover {
            background: var(--color-gray-800);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:focus {
            outline: 2px solid var(--color-black);
            outline-offset: 2px;
        }

        .demo-info {
            background: var(--color-gray-100);
            padding: 16px;
            border-radius: 8px;
            margin-top: 24px;
            text-align: center;
            color: var(--color-gray-700);
            font-size: 13px;
            line-height: 1.6;
            border: 1px solid var(--border-color);
        }

        .demo-info strong {
            color: var(--color-black);
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
        }

        .error-message {
            background: var(--color-gray-100);
            color: var(--color-gray-800);
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            border-left: 3px solid var(--color-black);
            font-size: 14px;
            line-height: 1.5;
        }

        .success-message {
            background: var(--color-gray-100);
            color: var(--color-gray-800);
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            border-left: 3px solid var(--color-black);
            font-size: 14px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
            }

            .logo h1 {
                font-size: 28px;
            }

            .form-group {
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🎓 QuizServer</h1>
            <p>Admin Portal</p>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" value="admin@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <div class="remember-me">
                <input type="checkbox" id="rememberMe" name="rememberMe">
                <label for="rememberMe">Remember me</label>
            </div>

            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div class="demo-info">
            <strong>Demo Credentials:</strong><br>
            Email: admin@example.com<br>
            Password: admin123
        </div>
    </div>

    <script>
        // Simple, working login script
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            // Clear previous messages
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            // Basic validation
            if (!email || !password) {
                showError('Please fill in all fields');
                return;
            }
            
            try {
                console.log('Attempting login with:', { email, password: '***' });
                
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                    credentials: 'include' // Important for session cookies
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                const data = await response.json();
                console.log('Response data:', data);
                
                if (response.ok) {
                    showSuccess('Login successful! Redirecting...');
                    setTimeout(() => {
                        window.location.href = '/custom-dashboard';
                    }, 1500);
                } else {
                    showError(data.message || 'Login failed');
                }
            } catch (error) {
                console.error('Login error details:', error);
                console.error('Error message:', error.message);
                console.error('Error stack:', error.stack);
                showError('Network error: ' + error.message);
            }
        });
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
        }
    </script>
</body>
</html>
